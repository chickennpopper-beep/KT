
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KT Interface</title>
    <style>
        body {
            background-color: #0b0c10;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        img {
            max-height: 80vh;
        }
        #canvasContainer {
            position: absolute;
            bottom: 10%;
        }
        canvas {
            background: transparent;
            display: block;
        }
    </style>
</head>
<body>
    <img id="ktImage" src="kt_napping.png" alt="KT Sleeping">
    <img id="neoImage" src="neo_awake.png" alt="Neo Sitting" style="position:absolute; bottom:10%; right:10%; width:150px;">
    <div id="canvasContainer">
        <canvas id="neoMatrixCanvas" width="200" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('neoMatrixCanvas');
        const ctx = canvas.getContext('2d');

        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%';
        const fontSize = 10;
        const columns = canvas.width / fontSize;
        const drops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = `${fontSize}px monospace`;

            drops.forEach((y, index) => {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                const x = index * fontSize;
                ctx.fillText(text, x, y * fontSize);

                if (y * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[index] = 0;
                }
                drops[index]++;
            });
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
